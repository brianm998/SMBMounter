name: Release

# Triggered by a version tag push:
#     git tag v1.0.0 && git push origin v1.0.0
# Can also be run manually (Actions -> Release -> "Run workflow") to exercise the
# build pipeline without cutting a release -- the publish job is skipped unless a
# tag triggered the run.
#
# macOS-only. Produces:
#   * a .pkg installer (binary + LaunchDaemon plist + example config + log
#     rotation), signed + notarized when Apple Developer ID secrets are present
#     and gracefully UNSIGNED when they are not;
#   * a prebuilt binary tarball.
# Both are attached to a draft GitHub Release for review before publishing.
#
# Optional repo secrets for signing + notarization (all-or-nothing — set every
# one, or none for an unsigned build):
#   APPLE_CERTIFICATE_P12_BASE64  base64 of a .p12 containing BOTH a
#                                 "Developer ID Application" and a
#                                 "Developer ID Installer" identity (+ keys)
#   APPLE_CERTIFICATE_PASSWORD    password for that .p12
#   KEYCHAIN_PASSWORD             any throwaway password for the temp keychain
#   APPLE_TEAM_ID                 10-char Team ID (e.g. AB12CD34EF)
#   APPLE_API_KEY_P8_BASE64       base64 of the App Store Connect API key (.p8)
#   APPLE_API_KEY_ID              the key's Key ID
#   APPLE_API_ISSUER_ID           the key's Issuer ID

on:
  push:
    tags: ['v*', 'release/*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 1.0.0). Defaults to the value in Constants.swift.'
        required: false

permissions:
  contents: write   # the publish job creates a GitHub Release

jobs:
  # ── Resolve the release version once; downstream jobs read it ─────────────
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag:     ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          elif [[ "$GITHUB_REF" == refs/tags/release/* ]]; then
            V="${GITHUB_REF_NAME#release/}"
          elif [[ -n "${{ inputs.version }}" ]]; then
            V="${{ inputs.version }}"
          else
            V="$(grep 'static let version' Sources/smbmounter/Constants.swift | head -1 | sed -E 's/.*"([^"]*)".*/\1/')"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V"    >> "$GITHUB_OUTPUT"
          echo "Resolved version: $V (tag v$V)"

  # ── Build the binary, sign it, and package the .pkg + tarball ─────────────
  build:
    name: Build & package (macOS)
    runs-on: macos-latest
    needs: version
    steps:
      - uses: actions/checkout@v4

      # Import a Developer ID cert into a throwaway keychain so codesign +
      # pkgbuild can sign inline. The .p12 must contain BOTH the Application and
      # Installer identities. Gracefully no-ops (has_cert=false) if the secret is
      # absent, yielding an unsigned build.
      - name: Import Developer ID certificate
        id: cert
        env:
          P12_B64:  ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          P12_PASS: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KC_PASS:  ${{ secrets.KEYCHAIN_PASSWORD }}
          TEAM:     ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ -z "$P12_B64" ]]; then
            echo "APPLE_CERTIFICATE_P12_BASE64 not set — .pkg will be unsigned"
            echo "has_cert=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KC="$RUNNER_TEMP/build.keychain"
          P12="$RUNNER_TEMP/certs.p12"
          echo "$P12_B64" | base64 --decode > "$P12"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          security import "$P12" -k "$KC" -P "$P12_PASS" \
            -T /usr/bin/codesign \
            -T /usr/bin/pkgbuild \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KC"
          security list-keychains -d user -s "$KC" \
            $(security list-keychains -d user | tr -d '"')
          security find-identity -v "$KC"
          APP_N=$(security find-identity -v "$KC" | grep -c "Developer ID Application:.*${TEAM}" || true)
          PKG_N=$(security find-identity -v "$KC" | grep -c "Developer ID Installer:.*${TEAM}"  || true)
          if [[ "$APP_N" -lt 1 || "$PKG_N" -lt 1 ]]; then
            echo "::error::Missing Developer ID identities for team ${TEAM} (Application=${APP_N}, Installer=${PKG_N})."
            exit 1
          fi
          SIGN_APP=$(security find-identity -v "$KC" | grep "Developer ID Application:.*${TEAM}" | head -1 | sed 's/.*"\(.*\)".*/\1/')
          SIGN_PKG=$(security find-identity -v "$KC" | grep "Developer ID Installer:.*${TEAM}"  | head -1 | sed 's/.*"\(.*\)".*/\1/')
          rm -f "$P12"
          echo "has_cert=true"        >> "$GITHUB_OUTPUT"
          echo "sign_app=${SIGN_APP}" >> "$GITHUB_OUTPUT"
          echo "sign_pkg=${SIGN_PKG}" >> "$GITHUB_OUTPUT"

      - name: Stage App Store Connect API key
        if: steps.cert.outputs.has_cert == 'true'
        env:
          KEY_B64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          KEY_ID:  ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/private_keys"
          echo "$KEY_B64" | base64 --decode > "$RUNNER_TEMP/private_keys/AuthKey_${KEY_ID}.p8"

      - name: Build and package
        shell: bash
        run: |
          ARGS=(--version "${{ needs.version.outputs.version }}" --out dist)
          if [[ "${{ steps.cert.outputs.has_cert }}" == "true" ]]; then
            ARGS+=(--sign-app "${{ steps.cert.outputs.sign_app }}" --sign-pkg "${{ steps.cert.outputs.sign_pkg }}")
          fi
          ./scripts/build-pkg.sh "${ARGS[@]}"

      # Notarize the signed .pkg and staple the ticket so it installs offline
      # without a Gatekeeper prompt. Only runs when we actually signed.
      - name: Notarize and staple .pkg
        if: steps.cert.outputs.has_cert == 'true'
        env:
          KEY_ID:    ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          PKG="$(ls dist/*.pkg | head -1)"
          [[ -z "$PKG" ]] && { echo "::error::no .pkg in dist/"; exit 1; }
          KEY_PATH="$RUNNER_TEMP/private_keys/AuthKey_${KEY_ID}.p8"
          OUT=$(xcrun notarytool submit "$PKG" \
            --key "$KEY_PATH" --key-id "$KEY_ID" --issuer "$ISSUER_ID" --wait 2>&1) || true
          echo "$OUT"
          STATUS=$(echo "$OUT" | grep -E '^[[:space:]]*status:' | tail -1 | awk '{print $2}')
          SUBID=$(echo  "$OUT" | grep -E '^[[:space:]]*id:'     | head -1 | awk '{print $2}')
          if [[ "$STATUS" != "Accepted" ]]; then
            echo "::error::notarization returned '${STATUS}' (id: ${SUBID})"
            if [[ -n "$SUBID" ]]; then
              xcrun notarytool log "$SUBID" \
                --key "$KEY_PATH" --key-id "$KEY_ID" --issuer "$ISSUER_ID" 2>&1 || true
            fi
            exit 1
          fi
          xcrun stapler staple "$PKG"

      - name: Clean up keychain and API key
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/private_keys"

      - uses: actions/upload-artifact@v4
        with:
          name: smbmounter-pkg
          path: dist/*.pkg
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: smbmounter-tarball
          path: dist/*.tar.gz
          if-no-files-found: error

  # ── Publish a draft GitHub Release with the artifacts ─────────────────────
  # Skipped on workflow_dispatch (no tag) so you can dry-run the build without
  # creating a half-baked release.
  release-publish:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [version, build]
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/release/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: smbmounter-pkg
          path: release-artifacts/
      - uses: actions/download-artifact@v4
        with:
          name: smbmounter-tarball
          path: release-artifacts/
      - name: List release artifacts
        run: find release-artifacts -type f | sort
      - uses: softprops/action-gh-release@v2
        with:
          tag_name:               ${{ needs.version.outputs.tag }}
          name:                   smbmounter ${{ needs.version.outputs.version }}
          draft:                  true    # review before publishing
          generate_release_notes: true
          files:                  release-artifacts/**/*
